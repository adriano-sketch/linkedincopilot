    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Does LinkedIn Copilot post comments for me?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Copilot finds the post and writes a draft. You read it, change what you want, open the post and publish the comment yourself on LinkedIn. The extension has no function that posts a comment."
          }
        },
        {
          "@type": "Question",
          "name": "What does the extension do by itself, then?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It opens LinkedIn pages in your own browser to read them: posts by your connections, search results for the audiences you define, your list of connections. It also sends connection invitations to people who match an audience you set up, with the note you wrote, and sends the messages you approved. All of it inside daily limits and inside the hours you choose."
          }
        },
        {
          "@type": "Question",
          "name": "Is this allowed by LinkedIn? Can my account be restricted?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LinkedIn's User Agreement restricts third-party tools that automate activity, and no tool can honestly promise zero risk. What Copilot does is keep the activity low and stop when LinkedIn objects: a single daily ceiling for profile pages that starts at 15, your own days and hours, and an automatic pause on any verification or warning page. Using it is your decision. If you want no risk at all, do not use any tool of this kind."
          }
        },
        {
          "@type": "Question",
          "name": "Why are the limits so low?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Because LinkedIn does not publish its limits, and the numbers other tools advertise are their own guesses. We run every limit on our own account first. When LinkedIn objected to the volume of profile pages on that account, we lowered the ceiling for everyone and made it a single budget shared by all features."
          }
        },
        {
          "@type": "Question",
          "name": "How does it know what I would say?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You write it down once: your subjects, what you think about each one, what you have seen in your work, and what you never want to say. Drafts are built from that and from the post. If a post is not about your subjects, there is no draft."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need Sales Navigator?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Finding posts by your own connections and drafting comments works with a free LinkedIn account. Sales Navigator is recommended only if you want to find new people by audience, because its filters (job title, seniority, region, company size) make that search much more precise."
          }
        },
        {
          "@type": "Question",
          "name": "How many invitations does it send?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You set a weekly number and Copilot spreads it over the week. Each invitation also counts toward the daily ceiling of profile pages, so in the first weeks that means a handful a day. The best matches for your audience go first."
          }
        },
        {
          "@type": "Question",
          "name": "What data does it read, and where does it go?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The extension reads the LinkedIn pages it opens in your session: names, headlines, companies and post text of your connections and of people who match your audiences. It never reads or stores your LinkedIn password. Drafts are written with AI by Anthropic. The data is not sold and is not used to train AI models. The privacy policy has the full list."
          }
        },
        {
          "@type": "Question",
          "name": "Can I edit or reject what it writes?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Always. Every comment is a draft you post yourself, and every message waits for your approval. You can edit, skip or reject any of them."
          }
        },
        {
          "@type": "Question",
          "name": "What does it cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You try everything free for 14 days, with no credit card. After that there is one plan: Pro, $69 a month per LinkedIn account, or $690 a year. If you do not subscribe when the trial ends, Copilot stops looking for posts, writing drafts and sending invitations; what is already in your Inbox stays there."
          }
        }
      ]
    }
